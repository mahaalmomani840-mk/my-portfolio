services:
  - type: web
    name: maha-almomani-portfolio
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build:static
    staticPublishPath: ./dist/public
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
